<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O‘zbek alifbosi konvertori</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{--bg:#f4efe2;--card:#fffdf7;--tx:#14233b;--mut:#5d6b7e;--bd:#d8cfb8;--ac:#0b7a86;--gold:#c9a227;--on:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
.hd{background:linear-gradient(135deg,#17386b,#0b8a96);color:#fff;padding:16px 14px 18px;border-bottom:6px solid var(--gold)}
.hd h1{margin:0;font:700 1.15rem/1.25 Georgia,"Noto Serif",serif}
.hd p{margin:4px 0 0;font-size:.85rem;opacity:.92}
main{padding:14px}
label{display:block;font-size:.8rem;font-weight:600;color:var(--ac);margin:12px 0 4px}
select,button{font:inherit;width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button.p{margin-top:16px;background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600;cursor:pointer}
button.p:disabled{opacity:.6}
.sw{width:auto;display:block;margin:8px auto 0;padding:4px 14px;cursor:pointer}
.r{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem}
.r label{display:flex;align-items:center;gap:6px;margin:0;font-weight:400;color:var(--tx)}
#st{margin-top:12px;font-size:.9rem;color:var(--mut)}
.n{margin-top:14px;font-size:.8rem;color:var(--mut)}
</style></head><body>
<div class="hd"><h1>O‘zbek alifbosi konvertori</h1><p>Eski lotin ⇄ yangi lotin ⇄ kirill</p></div>
<main>
<label for="f">Qayerdan</label>
<select id="f"><option value="o" selected>Eski lotin</option><option value="n">Yangi lotin</option><option value="c">Kirill</option></select>
<button class="sw" id="sw" title="Almashtirish">⇅</button>
<label for="t">Qayerga</label>
<select id="t"><option value="o">Eski lotin</option><option value="n" selected>Yangi lotin</option><option value="c">Kirill</option></select>
<label>Qaysi matn</label>
<div class="r"><label><input type="radio" name="s" value="sel" checked> Tanlangan matn</label><label><input type="radio" name="s" value="all"> Butun hujjat</label></div>
<button class="p" id="go">Almashtirish</button>
<div id="st"></div>
<div class="n">Tanlangan matn bo‘lmasa, butun hujjat almashtiriladi. Natijani Ctrl+Z bilan qaytarish mumkin.</div>
</main>
<script src="conv.js"></script>
<script>
const $=id=>document.getElementById(id);
$("sw").onclick=()=>{const a=$("f").value;$("f").value=$("t").value;$("t").value=a};
Office.onReady(()=>{
$("go").onclick=async()=>{
const f=$("f").value,t=$("t").value;
if(f==t){$("st").textContent="Ikkala yozuv bir xil.";return}
$("go").disabled=true;$("st").textContent="Ishlanmoqda...";
try{const r=await UZ.run(f,t,document.querySelector("input[name=s]:checked").value);
$("st").textContent="Tayyor: "+r.used+", "+r.n+" ta so‘z o‘zgardi."}
catch(e){$("st").textContent="Xato: "+((e&&e.message)||e)}
$("go").disabled=false}});
</script></body></html>
