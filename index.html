<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O‘zbek alifbosi konvertori</title>
<style>
:root{--bg:#f7f7f3;--card:#fff;--tx:#1c1c1a;--mut:#6a6a64;--bd:#d9d9d0;--ac:#1f6f5c;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#212120;--tx:#ececE6;--mut:#9a9a92;--bd:#3a3a37;--ac:#4fb59c;--on:#0e1a17}}
:root[data-theme="dark"]{--bg:#161615;--card:#212120;--tx:#ececE6;--mut:#9a9a92;--bd:#3a3a37;--ac:#4fb59c;--on:#0e1a17}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
p.s{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer}
.seg button.on,.btn.p{background:var(--ac);color:var(--on);border-color:var(--ac)}
select{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 10px;border-radius:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}
textarea{width:100%;min-height:200px;resize:vertical;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px}
#drop{border:2px dashed var(--bd);border-radius:10px;padding:22px;text-align:center;color:var(--mut);cursor:pointer}
#drop.o{border-color:var(--ac);color:var(--tx)}
.m{color:var(--mut);font-size:.9rem;margin-top:8px}
.map{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.map span{border:1px solid var(--bd);border-radius:6px;padding:2px 8px;font-size:.9rem}
</style></head><body><main>
<h1>O‘zbek alifbosi konvertori</h1>
<p class="s">Eski lotin, yangi lotin va kirill yozuvlari o‘rtasida matn va fayllarni almashtiring.</p>

<div class="card">
<div class="row"><select id="fr" aria-label="Qayerdan"><option value="o" selected>Eski lotin</option><option value="n">Yangi lotin</option><option value="c">Kirill</option></select><button class="btn" id="sw" title="Almashtirish">⇄</button><select id="to" aria-label="Qayerga"><option value="o">Eski lotin</option><option value="n" selected>Yangi lotin</option><option value="c">Kirill</option></select></div>
<div class="map" id="map"></div>
</div>

<div class="card">
<div class="grid">
<div><label for="a">Matn</label><textarea id="a" placeholder="O‘zbekiston, g‘oya, shahar, choy..."></textarea></div>
<div><label for="b">Natija</label><textarea id="b" readonly></textarea></div>
</div>
<div class="row" style="margin-top:10px"><button class="btn p" id="cp">Nusxalash</button><button class="btn" id="cl">Tozalash</button><span class="m" id="st"></span></div>
</div>

<div class="card">
<label>Fayl</label><div class="row"><select id="ff" aria-label="Fayl: qayerdan"><option value="o" selected>Eski lotin</option><option value="n">Yangi lotin</option><option value="c">Kirill</option></select><button class="btn" id="fsw" title="Almashtirish">⇄</button><select id="ft" aria-label="Fayl: qayerga"><option value="o">Eski lotin</option><option value="n" selected>Yangi lotin</option><option value="c">Kirill</option></select></div><div class="map" id="fmap"></div>
<div id="drop" style="margin-top:12px">Faylni shu yerga tashlang yoki tanlash uchun bosing<br><small>.txt .docx .pdf .md .csv .srt .html .json</small></div>
<input type="file" id="fi" hidden accept=".txt,.docx,.pdf,.md,.csv,.srt,.html,.json">
<div class="row" style="margin-top:10px"><button class="btn p" id="dl" hidden>Natijani yuklab olish</button><span class="m" id="fs"></span></div><textarea id="fo" readonly hidden style="margin-top:10px;min-height:140px"></textarea>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const Q="['‘’ʻʼ`´′]";
const fwd=s=>{let n=0;
s=s.replace(new RegExp("([OoGg])"+Q,"g"),(m,c)=>{n++;return {O:"Ö",o:"ö",G:"Ğ",g:"ğ"}[c]});
s=s.replace(/([Ss])[Hh]/g,(m,c)=>{n++;return c=="S"?"Ş":"ş"});
s=s.replace(/([Cc])[Hh]/g,(m,c)=>{n++;return c=="C"?"Ç":"ç"});
return [s,n]};
const M={"Ö":"O‘","ö":"o‘","Ğ":"G‘","ğ":"g‘","Ş":"Sh","ş":"sh","Ç":"Ch","ç":"ch"};
const rev=s=>{let n=0;s=s.replace(/[ÖöĞğŞşÇç]/g,m=>{n++;return M[m]});return [s,n]};
let res=null;
const $=id=>document.getElementById(id);
const CY=/[А-Яа-яЁёЎўҚқҒғҲҳ]/g,CL=/[А-Яа-яЁёЎўҚқҒғҲҳ]/,VW=/[аеёиоуўэюяыАЕЁИОУЎЭЮЯЫ]/;
const C={а:"a",б:"b",в:"v",г:"g",д:"d",ж:"j",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"x",ц:"ts",ч:"ch",ш:"sh",щ:"shch",ъ:"’",ь:"",ы:"i",э:"e",ю:"yu",я:"ya",ё:"yo",ў:"o‘",қ:"q",ғ:"g‘",ҳ:"h",е:"e"};
const B={a:"а",b:"б",d:"д",f:"ф",g:"г",h:"ҳ",i:"и",j:"ж",k:"к",l:"л",m:"м",n:"н",o:"о",p:"п",q:"қ",r:"р",s:"с",t:"т",u:"у",v:"в",x:"х",y:"й",z:"з"};
const up=c=>c!==c.toLowerCase(),ap=c=>!!c&&/['‘’ʻʼ`´′]/.test(c),cap=(m,all)=>all?m.toUpperCase():m[0].toUpperCase()+m.slice(1);
function cyr2lat(s){return s.replace(CY,(c,i)=>{const l=c.toLowerCase(),p=s[i-1],n=s[i+1];let m=C[l];
if(l=="е")m=(!p||!CL.test(p)||VW.test(p))?"ye":"e";
if(l=="ц"&&(!p||!CL.test(p)))m="s";
if(!up(c)||!m)return m;
return cap(m,m.length>1&&((n&&CL.test(n)&&up(n))||(p&&CL.test(p)&&up(p))))})}
function lat2cyr(s){let o="";for(let i=0;i<s.length;){const c=s[i],l=c.toLowerCase(),n=s[i+1]||"",nl=n.toLowerCase();let m,len=1;
if((l=="o"||l=="g")&&ap(n)){m=l=="o"?"ў":"ғ";len=2}
else if(l=="s"&&nl=="h"){m="ш";len=2}
else if(l=="c"&&nl=="h"){m="ч";len=2}
else if(l=="t"&&nl=="s"){m="ц";len=2}
else if(l=="y"&&nl&&"ouae".includes(nl)&&!(nl=="o"&&ap(s[i+2]))){m={o:"ё",u:"ю",a:"я",e:"е"}[nl];len=2}
else if(ap(c))m="ъ";
else if(l=="e")m=(i&&/[a-z‘’ʻʼ'`´′]/i.test(s[i-1]))?"е":"э";
else m=B[l];
if(!m){o+=c;i++;continue}
if(up(c))m=cap(m,len==2&&up(n)&&m.length>1);
o+=m;i+=len}return o}
const toOld={o:s=>[s,0],n:rev,c:s=>[cyr2lat(s),(s.match(CY)||[]).length]};
const fromOld={o:s=>[s,0],n:fwd,c:s=>{const r=lat2cyr(s);return[r,(r.match(CY)||[]).length]}};
const conv=(A="fr",B="to")=>s=>{const f=$(A).value,t=$(B).value;if(f==t)return[s,0];const[a,n]=toOld[f](s),[b,m]=fromOld[t](a);return[b,Math.max(n,m)]};
function map(A,B,id){const f=$(A).value,t=$(B).value,nw=f=="n"||t=="n",cy=f=="c"||t=="c";
let a;if(f==t)a=[];else if(cy)a=nw?["Ў ↔ Ö","Ғ ↔ Ğ","Ш ↔ Ş","Ч ↔ Ç","Қ ↔ Q","Ҳ ↔ H"]:["Ў ↔ O‘","Ғ ↔ G‘","Ш ↔ Sh","Ч ↔ Ch","Қ ↔ Q","Ҳ ↔ H"];
else a=t=="n"?["O‘ → Ö","G‘ → Ğ","Sh → Ş","Ch → Ç"]:["Ö → O‘","Ğ → G‘","Ş → Sh","Ç → Ch"];
$(id).innerHTML=a.map(x=>"<span>"+x+"</span>").join("")}
function run(){const [r,n]=conv()($("a").value);$("b").value=r;$("st").textContent=$("a").value?n+" ta almashtirish":""}
const chg=()=>{map("fr","to","map");run()},fchg=()=>{map("ff","ft","fmap");if(res)file(res.src)};
$("fr").onchange=$("to").onchange=chg;
$("sw").onclick=()=>{const t=$("fr").value;$("fr").value=$("to").value;$("to").value=t;chg()};
$("ff").onchange=$("ft").onchange=fchg;
$("fsw").onclick=()=>{const t=$("ff").value;$("ff").value=$("ft").value;$("ft").value=t;fchg()};
$("a").oninput=run;
$("cl").onclick=()=>{$("a").value="";run()};
$("cp").onclick=async()=>{try{await navigator.clipboard.writeText($("b").value)}catch(e){$("b").select();document.execCommand("copy")}$("st").textContent="Nusxalandi"};
async function docx(f,fn){const z=await JSZip.loadAsync(f);let n=0;
for(const p of Object.keys(z.files)){if(!/^word\/(document|header\d*|footer\d*|footnotes|endnotes)\.xml$/.test(p))continue;
let x=await z.file(p).async("string");
x=x.replace(/(<w:t(?:\s[^>]*)?>)([^<]*)(<\/w:t>)/g,(m,a,t,b)=>{t=t.replace(/&apos;|&#39;|&#x27;/g,"'");const[r,c]=fn(t);n+=c;return a+r+b});
z.file(p,x)}
return [await z.generateAsync({type:"blob"}),n]}
async function pdfText(f){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,o=[];
for(let i=1;i<=d.numPages;i++){const p=await(await d.getPage(i)).getTextContent();let s="";for(const it of p.items)s+=it.str+(it.hasEOL?"\n":"");o.push(s)}
return o.join("\n\n")}
async function file(f){
$("fs").textContent="Ishlanmoqda...";$("dl").hidden=true;
try{const base=f.name.replace(/\.[^.]+$/,""),ext=(f.name.split(".").pop()||"").toLowerCase();
let data,n,out=ext,txt=null;const cv=conv("ff","ft");
if(ext=="docx"){[data,n]=await docx(f,cv)}
else{const t=ext=="pdf"?await pdfText(f):await f.text();
if(!t.trim()){res=null;$("fo").hidden=true;$("fs").textContent="Faylda matn topilmadi (skan qilingan PDF bo‘lishi mumkin).";return}
[data,n]=cv(t);txt=data;if(ext=="pdf")out="txt"}
$("fo").hidden=txt==null;if(txt!=null)$("fo").value=txt.length>20000?txt.slice(0,20000)+"\n…":txt;
if(!["txt","md","csv","html","json","docx"].includes(out))out="txt";
res={src:f,data,name:base+"-"+{o:"eski",n:"yangi",c:"kirill"}[$("ft").value]+"."+out};
$("fs").textContent=f.name+": "+n+" ta almashtirish"+(txt==null?"":" (natija pastda ko‘rinadi)");
$("dl").hidden=false;
}catch(e){$("fs").textContent="Faylni o‘qib bo‘lmadi ("+((e&&e.message)||e)+").";res=null}}
$("fi").onchange=e=>{if(e.target.files[0])file(e.target.files[0]);e.target.value=""};
const d=$("drop");d.onclick=()=>$("fi").click();
d.ondragover=e=>{e.preventDefault();d.classList.add("o")};d.ondragleave=()=>d.classList.remove("o");
d.ondrop=e=>{e.preventDefault();d.classList.remove("o");if(e.dataTransfer.files[0])file(e.dataTransfer.files[0])};
$("dl").onclick=()=>{if(!res)return;const b=res.data instanceof Blob?res.data:new Blob([res.data],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=res.name;document.body.appendChild(a);a.click();a.remove()};
map("fr","to","map");map("ff","ft","fmap");
</script></body></html>
